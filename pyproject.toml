[project]
name = "jma-rainfall"
version = "0.9.0"
description = "気象庁「過去の気象データ検索」から降水量（10分値・時間値・日別値・年ごとの値・観測史上順位）を取得する"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.3",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "tqdm>=4.66",
  "truststore>=0.10",
]

[project.scripts]
jma-rainfall = "jma_rainfall.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jma_rainfall"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
